    <script>
        const article = document.querySelector('.project-article');
        const content = document.querySelector('.content');
        const firstImg = content.querySelector('img');

        // Move title and date below first image
        if (firstImg) {
            const header = document.createElement('header');
            header.className = 'project-header';

            const title = document.createElement('h1');
            title.textContent = 'Articles &amp; Discussions';
            header.appendChild(title);

            
            firstImg.parentNode.insertBefore(header, firstImg.nextSibling);
        }

        // Hide "Summary" and "Photos" headings
        const headings = content.querySelectorAll('h2');
        headings.forEach(h => {
            const text = h.textContent.trim();
            if (text === 'Summary' || text === 'Photos') {
                h.style.display = 'none';
            }
        });

        // Find content fold marker (<!--more--> becomes an HTML comment)
        const allNodes = Array.from(content.childNodes);
        let foldIndex = -1;

        allNodes.forEach((node, i) => {
            if (node.nodeType === Node.COMMENT_NODE && node.textContent.trim() === 'more') {
                foldIndex = i;
            }
        });

        // If fold marker found, split content
        if (foldIndex > -1) {
            const aboveFold = document.createElement('div');
            aboveFold.className = 'above-fold';

            const belowFold = document.createElement('div');
            belowFold.className = 'below-fold';

            const indicator = document.createElement('button');
            indicator.className = 'scroll-indicator';
            indicator.innerHTML = '<span>↓</span>';
            indicator.setAttribute('aria-label', 'Show more content');

            // Split content at fold
            allNodes.forEach((node, i) => {
                if (i < foldIndex) {
                    aboveFold.appendChild(node.cloneNode(true));
                } else if (i > foldIndex) {
                    belowFold.appendChild(node.cloneNode(true));
                }
            });

            // Clear and rebuild
            content.innerHTML = '';
            content.appendChild(aboveFold);
            content.appendChild(indicator);
            content.appendChild(belowFold);

            // Click to reveal
            indicator.addEventListener('click', () => {
                belowFold.classList.add('revealed');
                indicator.style.opacity = '0';

                // Smooth scroll to revealed content
                setTimeout(() => {
                    belowFold.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            });
        }
    </script>
